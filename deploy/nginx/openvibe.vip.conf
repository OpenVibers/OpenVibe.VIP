## ═══════════════════════════════════════════════════════════════
## openvibe.vip — Nginx Configuration (REFERENCE, not deployed)
##
## Deploy to /etc/nginx/sites-available/openvibe.vip.conf and reload nginx — only at launch: until
## the launch rule in README.md holds, openvibe.vip keeps its OpenVibe.Sites placeholder.
##
## The Node app (port 4620, systemd unit openvibe-vip) renders every page and serves /api/v1.
## Other OpenVibe services call it on http://127.0.0.1:4620 directly. Not published here:
##   /internal/   OpenVibe.Events delivers Billing events to 127.0.0.1:4620/internal/events
##   /metrics     host-local scrapers only (Node also refuses forwarded requests)
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovvip_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovvip_auth:10m rate=10r/m;
# Form posts only (join, cancel, dashboard): an empty key is not limited.
map $request_method $ovvip_form_key { POST $binary_remote_addr; default ""; }
limit_req_zone $ovvip_form_key zone=ovvip_forms:10m rate=2r/s;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.vip www.openvibe.vip;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.vip$request_uri; }
}

# ── www → apex ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.vip;

    ssl_certificate     /etc/letsencrypt/live/openvibe.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.vip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.vip$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.vip;

    ssl_certificate     /etc/letsencrypt/live/openvibe.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.vip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.vip.access.log;
    error_log  /var/log/nginx/openvibe.vip.error.log;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml text/xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Never public ────────────────────────────────────────
    location /internal/ { return 404; }
    location = /metrics { return 404; }

    # ── OAuth session endpoints (strict rate limit) ─────────
    location /auth/ {
        limit_req zone=ovvip_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4620;
    }

    # ── API (service and user tokens; moderate rate limit) ──
    location /api/ {
        limit_req zone=ovvip_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4620;
    }

    # ── Embeds: the public card, badge and widget (server/web/embeds.js) ──
    # Meant to be used by other sites: the widget sets its own CSP frame-ancestors, so this block does
    # not inherit the server's X-Frame-Options SAMEORIGIN (an add_header here replaces them all). Node
    # sets nosniff, Referrer-Policy and the CSP on every embed response.
    location ^~ /embed/ {
        limit_req zone=ovvip_api burst=30 nodelay;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://127.0.0.1:4620;
    }

    # ── Static assets: Node marks hashed ?v= URLs immutable ──
    location ~ ^/(?:css|js)/[^/]+\.(?:css|js)$ {
        proxy_pass http://127.0.0.1:4620;
    }

    # ── Pages; form posts (join, cancel, dashboard) are rate limited ──
    location / {
        limit_req zone=ovvip_forms burst=20 nodelay;
        proxy_pass http://127.0.0.1:4620;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
